<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" fill="url(#grad)" rx="19.2"/>
  
  <!-- Chef Hat Design -->
  <g transform="translate(64, 64)">
    <!-- Hat top puff -->
    <circle cx="0" cy="-15.36" r="20.48" fill="white" opacity="0.95"/>
    
    <!-- Left puff -->
    <circle cx="-15.36" cy="-5.12" r="15.36" fill="white" opacity="0.95"/>
    
    <!-- Right puff -->
    <circle cx="15.36" cy="-5.12" r="15.36" fill="white" opacity="0.95"/>
    
    <!-- Hat band -->
    <rect x="-25.6" y="5.12" width="51.2" height="10.24" fill="white" opacity="0.95" rx="2.56"/>
    
    <!-- Food elements (fork and spoon crossed) -->
    <!-- Fork -->
    <g opacity="0.3">
      <rect x="-19.2" y="19.2" width="5.12" height="23.04" fill="white" rx="1.28"/>
      <rect x="-21.76" y="19.2" width="1.92" height="10.24" fill="white"/>
      <rect x="-16.64" y="19.2" width="1.92" height="10.24" fill="white"/>
    </g>
    
    <!-- Spoon -->
    <g opacity="0.3">
      <circle cx="15.36" cy="24.32" r="3.2" fill="white"/>
      <rect x="12.8" y="26.88" width="5.12" height="15.36" fill="white" rx="1.28"/>
    </g>
  </g>
</svg>
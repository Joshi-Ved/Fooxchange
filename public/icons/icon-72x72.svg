    <!-- Hat band -->
    <rect x="-14.4" y="2.88" width="28.8" height="5.76" fill="white" opacity="0.95" rx="1.44"/>
    
    <!-- Food elements (fork and spoon crossed) -->
    <!-- Fork -->
    <g opacity="0.3">
      <rect x="-10.799999999999999" y="10.799999999999999" width="2.88" height="12.959999999999999" fill="white" rx="0.72"/>
      <rect x="-12.24" y="10.799999999999999" width="1.08" height="5.76" fill="white"/>
      <rect x="-9.36" y="10.799999999999999" width="1.08" height="5.76" fill="white"/>
    </g>
    
    <!-- Spoon -->
    <g opacity="0.3">
      <circle cx="8.64" cy="13.68" r="1.8" fill="white"/>
      <rect x="7.2" y="15.12" width="2.88" height="8.64" fill="white" rx="0.72"/>

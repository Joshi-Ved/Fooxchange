      <rect x="-76.8" y="76.8" width="20.48" height="92.16" fill="white" rx="5.12"/>
      <rect x="-87.04" y="76.8" width="7.68" height="40.96" fill="white"/>
      <rect x="-66.56" y="76.8" width="7.68" height="40.96" fill="white"/>

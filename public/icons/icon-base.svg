    <g opacity="0.3">
      <rect x="-153.6" y="153.6" width="40.96" height="184.32" fill="white" rx="10.24"/>
      <rect x="-174.08" y="153.6" width="15.36" height="81.92" fill="white"/>
      <rect x="-133.12" y="153.6" width="15.36" height="81.92" fill="white"/>
    </g>
    
    <!-- Spoon -->
    <g opacity="0.3">
      <circle cx="122.88" cy="194.56" r="25.6" fill="white"/>
      <rect x="102.4" y="215.04" width="40.96" height="122.88" fill="white" rx="10.24"/>

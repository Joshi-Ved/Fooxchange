    <!-- Hat top puff -->
    <circle cx="0" cy="-122.88" r="163.84" fill="white" opacity="0.95"/>
    
    <!-- Left puff -->
    <circle cx="-122.88" cy="-40.96" r="122.88" fill="white" opacity="0.95"/>
    
    <!-- Right puff -->

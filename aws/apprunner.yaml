# AWS App Runner configuration
# Deploy: aws apprunner create-service --cli-input-json file://aws/apprunner-service.json
# Or connect GitHub repo directly in the App Runner console

version: 1.0
runtime: nodejs18

build:
  commands:
    build:
      - npm ci
      - npx prisma generate
      - npm run build
  env:
    - name: NODE_ENV
      value: "production"
    - name: NEXT_TELEMETRY_DISABLED
      value: "1"

run:
  command: node .next/standalone/server.js
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: "production"
    - name: HOSTNAME
      value: "0.0.0.0"

# Food Ingredient Classes for Fooxchange YOLO Model
# These 80 classes cover the most common ingredients & dishes
# recognised by the camera scanner → recipe suggestion system.
#
# How to use:
#   python training/prepare_dataset.py \
#       --src training_imageset/archive \
#       --out training/yolo_dataset \
#       --classes training/food_classes.yaml
#
# Map class index → recipe ingredient name (used in the web app).
